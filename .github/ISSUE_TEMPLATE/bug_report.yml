name: Bug report
description: A step fails, a check is wrong, or the video or transcript is wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For a security problem, do **not** use this form:
        see [SECURITY.md](../blob/main/SECURITY.md) and report it privately.
        Never paste your Gemini key. The scripts redact it from their own output; check before you paste.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, and what you expected to see.
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Workflow step
      description: The step from the 15-step checklist in SKILL.md where it went wrong.
      options:
        - 0 preflight
        - 1 brief
        - 2 facts
        - 3 outline (gate 1)
        - 4 dialogue
        - 5 validate
        - 6 scenes and stills (gate 2)
        - 7 scratch audio
        - 8 real audio (tts.py)
        - 9 timing (align.mjs, fidelity.py)
        - 10 manifest (build_manifest.py)
        - 11 render and diagnostic QC
        - 12 learn and chapters
        - 13 judge and restate
        - 14 final QC (gate 3)
        - 15 redo one segment
        - search / library
        - other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and its full output, key redacted.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Python, Node, ffmpeg, Remotion (from preflight.py), and the Gemini model.
      placeholder: Python 3.13.1, Node 22.12, ffmpeg 7.1, Remotion 4.0.540, gemini-3.8-flash-tts
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From `claude plugin list`, or the `version` in `.claude-plugin/plugin.json` of your working copy.
      placeholder: 0.1.0
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.1 on M4; Ubuntu 24.04
