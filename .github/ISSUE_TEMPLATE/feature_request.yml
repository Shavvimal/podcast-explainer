name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should the skill do that it does not do today, and for which kind of concept or learner?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - pedagogy or script rules
        - a validator or QC check
        - TTS, voices or timing
        - a scene type or the concept world
        - transcript, library, learn/ files or search
        - another TTS or video engine
        - other
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        A new pedagogy rule needs evidence: cite the study and tag its strength as `learning-design.md` does.
        A new check needs a test that fails without it.
