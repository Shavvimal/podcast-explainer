version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
# The Remotion template is not watched on purpose: it pins exact versions (every @remotion/* line
# must match), a bump needs a real render check, and any change under skills/ needs a plugin version
# bump that Dependabot cannot make. Bump the template by hand; see DEVELOPING.md.
