# Tooling only. The scripts are not a package: they run from the skill folder with the standard library.

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["skills/podcast-explainer-video/scripts", "tests", "scripts"]

[tool.ruff.lint]
# Correctness rules the scripts pass today. Widen on purpose, in its own PR, with the fixes.
select = ["E9", "F", "B006", "B008", "PLE"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]
